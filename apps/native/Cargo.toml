[package]
name = "desk-native"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.0"
serde_json = "1"
smol = "2"
tungstenite = "0.27"
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
