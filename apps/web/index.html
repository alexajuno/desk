<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The font starts loading with the page, not once the first text is laid out: the splash waits for it. -->
    <link rel="preload" href="/fonts/InterVariable.ttf" as="font" type="font/ttf" crossorigin />
    <!-- desk as an app on the phone, which Chrome installs from the manifest; the phone's bar takes the panel's colour,
         --bg-panel in desk.css, by the system's theme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121213" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9fa" />
    <title>desk</title>
    <script>
      // Set before the page draws, as base.html does: the theme (the system's, unless pinned in this browser), read
      // mode, and the sidebar collapsed on a wide window. frame/theme.ts and frame/side.ts keep them current.
      document.documentElement.dataset.theme = ["light", "dark"].includes(localStorage.theme) ? localStorage.theme
        : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (localStorage.readMode) document.documentElement.classList.add("read-mode");
      if (localStorage.sideCollapsed) document.documentElement.classList.add("side-collapsed");
      // On a phone, the keyboard is drawn over the page, which learns its height from Chrome (the VirtualKeyboard API,
      // as env(keyboard-inset-height) in phone.css): a chat sits on it, and the tabs under it come back as it closes,
      // focused box or not (28 Oct). Shrinking the page for it told the page nothing of the keyboard.
      if ("virtualKeyboard" in navigator) navigator.virtualKeyboard.overlaysContent = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The splash, Linear's: the empty frame in the page's theme, until the page can draw whole (app/splash.ts). -->
    <div id="splash" aria-hidden="true"><div class="splash-panel"><img class="splash-mark" src="/favicon.svg" alt="" width="32" height="32" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
