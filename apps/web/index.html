<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- On a phone, the keyboard shrinks the page, so a chat's composer stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- desk as an app on the phone, which Chrome installs from the manifest; the phone's bar takes the panel's colour,
         --bg-panel in desk.css, by the system's theme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121213" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9fa" />
    <title>desk</title>
    <script>
      // Set before the page draws, as base.html does: the theme (the system's, unless pinned in this browser), read
      // mode, and the sidebar collapsed on a wide window. frame/theme.ts and frame/side.ts keep them current.
      document.documentElement.dataset.theme = ["light", "dark"].includes(localStorage.theme) ? localStorage.theme
        : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (localStorage.readMode) document.documentElement.classList.add("read-mode");
      if (localStorage.sideCollapsed) document.documentElement.classList.add("side-collapsed");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
